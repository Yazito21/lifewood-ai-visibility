    <circle cx="150" cy="805" r="4"/><circle cx="255" cy="740" r="5"/><circle cx="370" cy="800" r="6"/><circle cx="470" cy="710" r="4"/><circle cx="590" cy="760" r="5"/><circle cx="680" cy="690" r="4"/>
