<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071b14"/><stop offset=".48" stop-color="#0d3829"/><stop offset="1" stop-color="#061710"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="matrix(640 420 -370 565 1470 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b8052" stop-opacity=".42"/><stop offset="1" stop-color="#0b8052" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="matrix(490 390 -370 465 360 790)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#064b34" stop-opacity=".28"/><stop offset="1" stop-color="#064b34" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#a7dfbd" stroke-opacity=".075"/>
      <circle cx="0" cy="0" r="1.4" fill="#7ad9a8" fill-opacity=".2"/>
    </pattern>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3cc78a" stop-opacity=".08"/><stop offset=".5" stop-color="#8be4b0" stop-opacity=".65"/><stop offset="1" stop-color="#ffc36b" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="robot" x1="1000" y1="180" x2="1370" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5e9c5" stop-opacity=".36"/><stop offset="1" stop-color="#277d58" stop-opacity=".04"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#cyanGlow)"/>
  <rect width="1920" height="1080" fill="url(#violetGlow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

