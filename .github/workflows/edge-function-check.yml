name: Edge Function Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check visibility tracking function
        run: deno check --node-modules-dir=none supabase/functions/visibility-tracking/index.ts
